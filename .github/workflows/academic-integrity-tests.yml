name: Academic Integrity Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/academic-integrity-agentic-core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run academic-integrity regression tests
        run: pytest -q test_academic_integrity.py
