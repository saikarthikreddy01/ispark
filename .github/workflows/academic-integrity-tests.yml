name: AcadGraph AI Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - hackathon/final-unified-prototype

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run academic and unified-entrypoint regression tests
        run: pytest -q test_academic_integrity.py test_agent_entrypoint.py
      - name: Start unified AcadGraph AI application
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 > /tmp/acadgraph.log 2>&1 &
          echo $! > /tmp/acadgraph.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | python -m json.tool > /dev/null
          curl -fsS http://127.0.0.1:8000/api/demo | python -m json.tool > /dev/null
          curl -fsS http://127.0.0.1:8000/api/courses | python -m json.tool > /dev/null
          curl -fsS http://127.0.0.1:8000/ > /tmp/index.html
          grep -q "AcadGraph AI" /tmp/index.html
          curl -fsS http://127.0.0.1:8000/app.js > /tmp/app.js
          curl -fsS http://127.0.0.1:8000/app.css > /tmp/app.css
          test -s /tmp/app.js
          test -s /tmp/app.css
      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/acadgraph.pid ]; then kill $(cat /tmp/acadgraph.pid) || true; fi
          if [ -f /tmp/acadgraph.log ]; then tail -n 120 /tmp/acadgraph.log; fi
