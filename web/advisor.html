<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advisor | Academic Advisor</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body data-page="advisor">

  <!-- Top Application Navigation Header -->
  <header class="appbar">
    <nav class="nav">
      <!-- Shared navigation links dynamically injected here -->
    </nav>
    <div class="userbar">
      <!-- Session user profile status panel -->
    </div>
  </header>

  <!-- Central Interface Layout -->
  <main class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">04 &middot; Personalized guidance</span>
        <h1>Ask the advisor</h1>
        <p>Get a direct answer grounded in your transcript, course graph, C24 catalog, and academic policy.</p>
      </div>
    </div>

    <!-- Agentic Chat Input Workspace -->
    <form class="panel stack" data-form>
      <label>
        Your question
        <textarea name="question" required placeholder="Can I take Algorithms next semester? What should I do first?"></textarea>
      </label>
      <button class="btn btn-primary" type="submit">Ask with cited sources</button>
    </form>

    <!-- Grounded Graph-RAG Response Viewport -->
    <section class="panel" data-output>
      <div class="empty">Your cited answer will appear here.</div>
    </section>
  </main>

  <!-- Global Context Status Alerts -->
  <div id="toast"></div>

  <!-- Operational Lifecycle Configurations -->
  <script src="portal.js"></script>
  <script src="feature.js"></script>
</body>
</html>
