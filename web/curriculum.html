<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curriculum | Academic Advisor</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body data-page="curriculum">

  <!-- Top Application Navigation Header -->
  <header class="appbar">
    <nav class="nav">
      <!-- Shared navigation items injected at runtime -->
    </nav>
    <div class="userbar">
      <!-- Active user controls and authorization state -->
    </div>
  </header>

  <!-- Central Interface Layout -->
  <main class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">01 &middot; Degree rules</span>
        <h1>C24 curriculum</h1>
        <p>Browse the official course structure, prerequisites, credit requirements, and semester sequence.</p>
      </div>
      
      <!-- Interactive Course Database Filter -->
      <input data-search placeholder="Search course or topic">
    </div>

    <!-- Dynamic Metrics and Summary Output -->
    <div data-summary></div>

    <!-- Active Visualization Workspace -->
    <section class="panel" data-output>
      <div class="empty">Loading curriculum&hellip;</div>
    </section>
  </main>

  <!-- Global Context Status Alerts -->
  <div id="toast"></div>

  <!-- Operational Lifecycle Configurations -->
  <script src="portal.js"></script>
  <script src="feature.js"></script>
</body>
</html>
