<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Substitutions | Academic Advisor</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body data-page="substitutions">

  <!-- Top Application Navigation Header -->
  <header class="appbar">
    <nav class="nav">
      <!-- Shared navigation items injected at runtime -->
    </nav>
    <div class="userbar">
      <!-- Active user controls and authorization state -->
    </div>
  </header>

  <!-- Central Interface Layout -->
  <main class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">07 &middot; Approved alternatives</span>
        <h1>Course substitutions</h1>
        <p>Find approved equivalent courses and apply an alternative to your planned pathway.</p>
      </div>
    </div>

    <!-- Course Selection Query Panel -->
    <section class="panel stack">
      <label>
        Course
        <select data-course-options></select>
      </label>
      <button class="btn btn-primary" type="button" data-load>Find approved alternatives</button>
    </section>

    <!-- Equivalency Results Visualization Workspace -->
    <section class="panel" data-output>
      <div class="empty">Choose a course to search.</div>
    </section>
  </main>

  <!-- Global Context Status Alerts -->
  <div id="toast"></div>

  <!-- Operational Lifecycle Configurations -->
  <script src="portal.js"></script>
  <script src="feature.js"></script>
</body>
</html>
